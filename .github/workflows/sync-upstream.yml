name: Sync upstream

on:
  schedule:
    # 每天北京时间 05:17 检查一次上游
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "dsh-go-glass"
          git config user.email "glass@local"
          git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git 2>/dev/null || true
          git fetch upstream main --tags
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/main || {
            echo "::error::上游改动和本分支的玻璃改动冲突，需要手动合并"
            exit 1
          }
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "已是最新，没有新提交"
          else
            git push origin HEAD:main
            echo "已合并上游：$(git log -1 --oneline)"
          fi

      - name: Report sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="上游同步失败：需要手动合并"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="自动合并没完成（多半是上游改到了玻璃改动涉及的文件）。手动合并一次即可，处理完这个 issue 可以关掉。运行：$run_url"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
