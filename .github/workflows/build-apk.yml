name: Build glass APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: local.properties
        working-directory: app
        run: printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build arm64 release
        working-directory: app
        run: flutter build apk --release --flavor arm64 --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-glass-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
