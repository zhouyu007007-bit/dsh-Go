name: Build glass APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: On-device runtime from the official release
        run: |
          curl -fsSL -o /tmp/official.apk https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.10/dsh-go-1.0.10-arm64.apk
          mkdir -p /tmp/off
          unzip -q /tmp/official.apk "assets/runtime/*" "lib/arm64-v8a/*" -d /tmp/off
          mkdir -p runtime/out/arm64-v8a/assets runtime/out/arm64-v8a/jniLibs/arm64-v8a
          cp -r /tmp/off/assets/runtime runtime/out/arm64-v8a/assets/
          cp /tmp/off/lib/arm64-v8a/libproot.so /tmp/off/lib/arm64-v8a/libproot-loader.so \
             /tmp/off/lib/arm64-v8a/libandroid-shmem.so /tmp/off/lib/arm64-v8a/libtalloc.so \
             runtime/out/arm64-v8a/jniLibs/arm64-v8a/

      - name: Application id and label
        run: |
          python3 - <<'PY'
          p = 'app/android/app/build.gradle.kts'
          s = open(p).read()
          s = s.replace('applicationId = "io.github.ccch1mneyyy.dsh_app"', 'applicationId = "io.github.ccch1mneyyy.dsh_app.glass"')
          open(p, 'w').write(s)
          m = 'app/android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          t = t.replace('android:label="DSH Go"', 'android:label="DSH Go Glass"')
          open(m, 'w').write(t)
          PY

      - name: Signing key
        run: |
          mkdir -p app/android/app
          echo "${{ secrets.GLASS_KEYSTORE_B64 }}" | base64 -d > app/android/app/glass-release.jks
          cat > app/android/key.properties <<EOF
          storeFile=glass-release.jks
          storePassword=${{ secrets.GLASS_KEYSTORE_PASS }}
          keyAlias=${{ secrets.GLASS_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.GLASS_KEYSTORE_PASS }}
          EOF

      - name: Version
        id: ver
        run: |
          code=$(( (10#$(TZ=Asia/Shanghai date +%Y) - 2026) * 100000000 + 10#$(TZ=Asia/Shanghai date +%m%d%H%M) ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=1.0.10" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: local.properties
        working-directory: app
        run: printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build arm64 release
        working-directory: app
        run: |
          flutter build apk --release --flavor arm64 --target-platform android-arm64 \
            --build-name "${{ steps.ver.outputs.name }}" \
            --build-number "${{ steps.ver.outputs.code }}" \
            --no-tree-shake-icons \
            --dart-define=DSH_UPDATE_MIRROR=

      - name: Package and manifest
        run: |
          name="${{ steps.ver.outputs.name }}"
          code="${{ steps.ver.outputs.code }}"
          apk="dsh-go-${name}-arm64.apk"
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk "$apk"
          size=$(stat -c%s "$apk")
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > update.json <<EOF
          {
            "schema": 1,
            "version": "${name}+${code}",
            "tag": "v${code}",
            "title": "DSH Go Glass ${name}",
            "publishedAt": "${now}",
            "page": "https://github.com/zhouyu007007-bit/dsh-Go/releases/tag/v${code}",
            "assets": {
              "arm64": { "name": "${apk}", "size": ${size}, "sha256": "${sha}" }
            },
            "notes": "玻璃版：磨砂顶栏、透明度滑块、内置雾面背景。"
          }
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: DSH Go Glass ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          files: |
            update.json
            dsh-go-${{ steps.ver.outputs.name }}-arm64.apk
          body: |
            玻璃版自动构建：玻璃透明度滑块（设置 → 外观）、磨砂顶栏、内置雾面背景。
            安装后在 App 里「检查更新」即可升级到下一版。
