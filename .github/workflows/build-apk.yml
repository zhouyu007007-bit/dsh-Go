name: Build glass APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: On-device runtime from upstream's latest release
        id: runtime
        run: |
          set -uo pipefail
          cat > /tmp/pick.py <<'PY'
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          for a in d.get("assets", []):
              n = a.get("name", "")
              if n.endswith("-arm64.apk"):
                  print(d.get("tag_name", ""))
                  print(a["browser_download_url"])
                  break
          PY
          url=""; tag=""
          for i in 1 2 3; do
            out="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/ccch1mneyyy/dsh-Go/releases/latest | python3 /tmp/pick.py || true)"
            tag="$(printf '%s' "$out" | sed -n 1p)"
            url="$(printf '%s' "$out" | sed -n 2p)"
            [ -n "$url" ] && break
            sleep 3
          done
          if [ -z "$url" ]; then
            echo "::warning::读不到上游最新 release，回退 v1.0.10 的运行时"
            tag="v1.0.10"
            url="https://github.com/ccch1mneyyy/dsh-Go/releases/download/v1.0.10/dsh-go-1.0.10-arm64.apk"
          fi
          echo "source=$tag" >> "$GITHUB_OUTPUT"
          echo "运行时取自 $tag"
          curl -fsSL -o /tmp/official.apk "$url"
          mkdir -p /tmp/off
          unzip -q /tmp/official.apk "assets/runtime/*" "lib/arm64-v8a/*" -d /tmp/off
          test -f /tmp/off/assets/runtime/manifest.json || { echo "::error::下载到的包里没有 assets/runtime"; exit 1; }
          mkdir -p runtime/out/arm64-v8a/assets runtime/out/arm64-v8a/jniLibs/arm64-v8a
          cp -r /tmp/off/assets/runtime runtime/out/arm64-v8a/assets/
          for so in libproot.so libproot-loader.so libandroid-shmem.so libtalloc.so; do
            if [ -f "/tmp/off/lib/arm64-v8a/$so" ]; then
              cp "/tmp/off/lib/arm64-v8a/$so" runtime/out/arm64-v8a/jniLibs/arm64-v8a/
            else
              echo "::warning::上游包里缺少 $so"
            fi
          done

      - name: Application id and label
        run: |
          python3 - <<'PY'
          p = 'app/android/app/build.gradle.kts'
          s = open(p).read()
          s = s.replace('applicationId = "io.github.ccch1mneyyy.dsh_app"', 'applicationId = "io.github.ccch1mneyyy.dsh_app.glass"')
          open(p, 'w').write(s)
          m = 'app/android/app/src/main/AndroidManifest.xml'
          t = open(m).read()
          t = t.replace('android:label="DSH Go"', 'android:label="DSH Go Glass"')
          open(m, 'w').write(t)
          PY

      - name: Signing key
        run: |
          mkdir -p app/android/app
          echo "${{ secrets.GLASS_KEYSTORE_B64 }}" | base64 -d > app/android/app/glass-release.jks
          cat > app/android/key.properties <<EOF
          storeFile=glass-release.jks
          storePassword=${{ secrets.GLASS_KEYSTORE_PASS }}
          keyAlias=${{ secrets.GLASS_KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.GLASS_KEYSTORE_PASS }}
          EOF

      - name: Version
        id: ver
        run: |
          name="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)"
          [ -n "$name" ] || name="1.0.10"
          code=$(( (10#$(TZ=Asia/Shanghai date +%Y) - 2026) * 100000000 + 10#$(TZ=Asia/Shanghai date +%m%d%H%M) ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "版本 $name+$code"

      - name: Dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: local.properties
        working-directory: app
        run: printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build arm64 release
        working-directory: app
        run: |
          flutter build apk --release --flavor arm64 --target-platform android-arm64 \
            --build-name "${{ steps.ver.outputs.name }}" \
            --build-number "${{ steps.ver.outputs.code }}" \
            --no-tree-shake-icons \
            --dart-define=DSH_UPDATE_MIRROR=

      - name: Package and manifest
        run: |
          name="${{ steps.ver.outputs.name }}"
          code="${{ steps.ver.outputs.code }}"
          apk="dsh-go-${name}-arm64.apk"
          cp app/build/app/outputs/flutter-apk/app-arm64-release.apk "$apk"
          size=$(stat -c%s "$apk")
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > update.json <<EOF
          {
            "schema": 1,
            "version": "${name}+${code}",
            "tag": "v${code}",
            "title": "DSH Go Glass ${name}",
            "publishedAt": "${now}",
            "page": "https://github.com/zhouyu007007-bit/dsh-Go/releases/tag/v${code}",
            "assets": {
              "arm64": { "name": "${apk}", "size": ${size}, "sha256": "${sha}" }
            },
            "notes": "玻璃版：磨砂顶栏、透明度滑块、内置雾面背景。运行时取自 ${{ steps.runtime.outputs.source }}。"
          }
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: DSH Go Glass ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          files: |
            update.json
            dsh-go-${{ steps.ver.outputs.name }}-arm64.apk
          body: |
            玻璃版自动构建：玻璃透明度滑块（设置 → 外观）、磨砂顶栏、内置雾面背景。
            安装后在 App 里「检查更新」即可升级到下一版。

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="玻璃版构建失败"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="工作流：${{ github.workflow }}；提交：${{ github.sha }}；运行：$run_url"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
